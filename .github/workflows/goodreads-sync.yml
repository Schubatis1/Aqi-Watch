name: Goodreads sync

# Refreshes book-club/data/goodreads-<id>.json for every reader listed in
# book-club/data/readers.json from the public Goodreads shelf RSS feeds, so
# the GitHub Pages book-club picker always reflects current ratings.

on:
  schedule:
    - cron: "17 11 * * *" # daily, ~7am Eastern
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: goodreads-sync
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Fetch Goodreads shelves
        run: python3 book-club/scripts/fetch_goodreads.py

      - name: Commit if changed
        run: |
          # Stage first so a newly added reader's file counts. fetchedAt changes
          # every run; only commit when the books themselves changed.
          git add book-club/data/goodreads-*.json
          if git diff --cached --quiet -I '"fetchedAt"'; then
            echo "No shelf changes."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898283+github-actions[bot]@users.noreply.github.com"
          git commit -m "Sync Goodreads shelves"
          git push
