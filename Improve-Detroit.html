<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Clear the Lane</title>
    <!-- Tailwind CSS for fast, clean mobile styling -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- EXIF parser to pull GPS and Timestamp from photos client-side -->
    <script src="https://cdn.jsdelivr.net/npm/exifr/dist/full.umd.js"></script>
    <!-- PWA Manifest stub to allow saving to home screen -->
    <link rel="manifest" href="data:application/json;base64,eyJuYW1lIjoiQ2xlYXIgVGhlIExhbmUiLCJzaG9ydF9uYW1lIjoiQ2xlYXJMYW5lIiwiZGlzcGxheSI6InN0YW5kYWxvbmUifQ==">
</head>
<body class="bg-slate-100 p-4 font-sans text-slate-800 max-w-md mx-auto min-h-screen flex flex-col">

    <div class="bg-white rounded-xl shadow-md p-6 mb-6 mt-4 text-center">
        <h1 class="text-2xl font-bold text-blue-600 mb-2">Clear the Lane</h1>
        <p class="text-sm text-slate-500 mb-6">Upload a photo to automatically report a blocked bike lane to Improve Detroit.</p>

        <!-- Hidden File Input -->
        <input type="file" id="photoInput" accept="image/*" class="hidden">
        
        <!-- Upload Button -->
        <button onclick="document.getElementById('photoInput').click()" 
                class="w-full bg-blue-600 text-white font-semibold py-4 rounded-lg shadow hover:bg-blue-700 transition">
            Snap / Select Photo
        </button>
    </div>

    <!-- Preview & Submission Card (Hidden by default) -->
    <div id="previewCard" class="bg-white rounded-xl shadow-md p-6 hidden flex-col gap-4">
        <img id="imagePreview" class="w-full h-48 object-cover rounded-lg shadow-sm" alt="Selected photo">
        
        <div class="bg-slate-50 p-3 rounded border border-slate-200">
            <p class="text-xs font-bold text-slate-500 uppercase">Detected Location</p>
            <p id="addressText" class="font-medium text-slate-800 text-sm mt-1">Loading cross streets...</p>
        </div>

        <div class="bg-slate-50 p-3 rounded border border-slate-200">
            <p class="text-xs font-bold text-slate-500 uppercase">Photo Timestamp</p>
            <p id="timeText" class="font-mono text-slate-600 text-sm mt-1">--</p>
        </div>

        <button id="submitBtn" onclick="submitToSeeClickFix()" 
                class="w-full bg-emerald-600 text-white font-semibold py-4 rounded-lg shadow hover:bg-emerald-700 transition mt-2">
            Submit to Improve Detroit
        </button>
    </div>

    <!-- Status Messages -->
    <p id="statusMsg" class="mt-4 text-center text-sm font-medium"></p>

    <!-- ON-SCREEN DEBUG CONSOLE -->
    <div class="mt-8 bg-slate-900 rounded-lg p-4 shadow-inner flex-grow">
        <div class="flex justify-between items-center mb-2">
            <p class="text-xs font-bold text-slate-400 uppercase">Debug Console</p>
            <button onclick="document.getElementById('debugLog').innerHTML = ''" class="text-xs text-slate-500 hover:text-white">Clear</button>
        </div>
        <div id="debugLog" class="font-mono text-[10px] text-green-400 h-48 overflow-y-auto break-all whitespace-pre-wrap">
            App initialized...
        </div>
    </div>

    <script>
        // ==========================================
        // CONFIGURATION 
        // ==========================================
        const GOOGLE_MAPS_API_KEY = 'AIzaSyAts-aj_Ezg_OtGj05Tkh8kXRLPUcA9fAg';
        const SEECLICKFIX_TOKEN = 'token-07/31/2026-07/30/2027--B10B9B5D01CC998EE5A6C6BB8266537173326DC0F21EFE605455E64047D75A81-1';
        const DETROIT_REQUEST_TYPE_ID = '22880'; 
        
        // Custom Logger to pipe info to the UI
        function logToConsole(message, isError = false) {
            const logWindow = document.getElementById('debugLog');
            const timestamp = new Date().toLocaleTimeString('en-US', { hour12: false });
            const logLine = document.createElement('div');
            logLine.className = isError ? 'text-red-400 mb-1' : 'mb-1';
            
            let formattedMessage = message;
            if (message instanceof Error) {
                formattedMessage = `${message.name}: ${message.message}`;
            } else if (typeof message === 'object') {
                formattedMessage = JSON.stringify(message, null, 2);
            }

            logLine.textContent = `[${timestamp}] ${formattedMessage}`;
            logWindow.appendChild(logLine);
            logWindow.scrollTop = logWindow.scrollHeight;
        }

        // App State
        let currentFile = null;
        let currentLat = null;
        let currentLng = null;
        let currentAddress = null;
        let photoTimeString = null;

        const photoInput = document.getElementById('photoInput');
        const previewCard = document.getElementById('previewCard');
        const imagePreview = document.getElementById('imagePreview');
        const addressText = document.getElementById('addressText');
        const timeText = document.getElementById('timeText');
        const statusMsg = document.getElementById('statusMsg');
        const submitBtn = document.getElementById('submitBtn');

        // Handle File Selection & Extraction
        photoInput.addEventListener('change', async (e) => {
            const file = e.target.files[0];
            if (!file) return;

            logToConsole(`File selected: ${file.name} (${Math.round(file.size/1024)}KB)`);
            currentFile = file;
            statusMsg.textContent = "Extracting photo metadata...";
            statusMsg.className = "mt-4 text-center text-sm font-medium text-blue-600";
            
            imagePreview.src = URL.createObjectURL(file);
            previewCard.classList.remove('hidden');
            previewCard.classList.add('flex');

            try {
                logToConsole("Parsing EXIF data...");
                const exifData = await exifr.parse(file);
                const gps = await exifr.gps(file);
                
                if (!gps) {
                    throw new Error("No GPS data found. Ensure 'Location Tags' are enabled in your camera settings.");
                }

                currentLat = gps.latitude;
                currentLng = gps.longitude;
                logToConsole(`GPS found: ${currentLat.toFixed(5)}, ${currentLng.toFixed(5)}`);

                const rawDate = exifData?.DateTimeOriginal || exifData?.CreateDate || new Date(file.lastModified);
                const photoDateObj = new Date(rawDate);
                
                const datePart = photoDateObj.toLocaleDateString('en-US', { month: 'numeric', day: 'numeric', year: 'numeric' });
                const timePart = photoDateObj.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit' });

                photoTimeString = `${datePart} at approximately ${timePart}`;
                timeText.textContent = photoTimeString;
                logToConsole(`Timestamp generated: ${photoTimeString}`);

                statusMsg.textContent = "Resolving cross streets...";
                logToConsole("Fetching reverse geocode from Google Maps...");

                const geoUrl = `https://maps.googleapis.com/maps/api/geocode/json?latlng=${currentLat},${currentLng}&key=${GOOGLE_MAPS_API_KEY}&result_type=intersection`;
                const geoRes = await fetch(geoUrl);
                
                if (!geoRes.ok) {
                    throw new Error(`Google Maps API HTTP Error: ${geoRes.status}`);
                }
                
                const geoData = await geoRes.json();

                if (geoData.status === 'OK' && geoData.results.length > 0) {
                    currentAddress = geoData.results[0].formatted_address;
                    logToConsole(`Address resolved: ${currentAddress}`);
                } else {
                    currentAddress = `${currentLat}, ${currentLng}`; 
                    logToConsole(`Google Maps returned status: ${geoData.status}. Falling back to coordinates.`, true);
                }
                
                addressText.textContent = currentAddress;
                statusMsg.textContent = "Ready to submit!";
                statusMsg.className = "mt-4 text-center text-sm font-medium text-emerald-600";

            } catch (err) {
                addressText.textContent = "Location extraction failed.";
                timeText.textContent = "--";
                statusMsg.textContent = "Check debug console for error.";
                statusMsg.className = "mt-4 text-center text-sm font-medium text-red-600";
                logToConsole(err, true);
            }
        });

        // Submit to Improve Detroit (SeeClickFix)
        async function submitToSeeClickFix() {
            if (!currentLat || !currentLng || !currentFile) {
                logToConsole("Submission aborted: Missing location or image data.", true);
                return;
            }

            submitBtn.disabled = true;
            submitBtn.textContent = "Submitting...";
            submitBtn.classList.replace('bg-emerald-600', 'bg-slate-400');
            statusMsg.textContent = "Sending to Improve Detroit...";
            statusMsg.className = "mt-4 text-center text-sm font-medium text-blue-600";
            
            logToConsole("Building payload with structured answers for SeeClickFix API...");

            const formData = new FormData();
            formData.append('lat', currentLat);
            formData.append('lng', currentLng);
            formData.append('address', currentAddress);
            formData.append('request_type_id', DETROIT_REQUEST_TYPE_ID);
            formData.append('summary', 'Vehicle Blocking Bike Lane');
            formData.append('description', 'Vehicle blocking active bike lane.');
            
            // Structured Answers array mapping for SeeClickFix V2 API
            formData.append('answers[][question_id]', '32751');
            formData.append('answers[][answer]', ' Car traveling in bike lane');

            formData.append('answers[][question_id]', '33446');
            formData.append('answers[][answer]', photoTimeString);

            formData.append('image', currentFile);

            try {
                logToConsole("Dispatching POST request via CORS proxy...");
                
                const targetUrl = 'https://seeclickfix.com/api/v2/issues';
                const proxyUrl = `https://corsproxy.io/?${encodeURIComponent(targetUrl)}`;

                const response = await fetch(proxyUrl, {
                    method: 'POST',
                    headers: {
                        'Authorization': `Bearer ${SEECLICKFIX_TOKEN}`
                    },
                    body: formData
                });

                if (!response.ok) {
                    const errText = await response.text();
                    throw new Error(`SeeClickFix API Error ${response.status}: ${errText}`);
                }

                const responseData = await response.json();
                logToConsole(`Success! Issue ID: ${responseData.id}`);

                statusMsg.textContent = "Ticket successfully submitted! 🚴";
                statusMsg.className = "mt-4 text-center text-sm font-bold text-emerald-600";
                submitBtn.textContent = "Success";
                
                setTimeout(() => {
                    previewCard.classList.add('hidden');
                    previewCard.classList.remove('flex');
                    submitBtn.disabled = false;
                    submitBtn.textContent = "Submit to Improve Detroit";
                    submitBtn.classList.replace('bg-slate-400', 'bg-emerald-600');
                    statusMsg.textContent = "";
                    photoInput.value = ''; 
                }, 4000);

            } catch (error) {
                statusMsg.textContent = "Failed to submit ticket.";
                statusMsg.className = "mt-4 text-center text-sm font-medium text-red-600";
                logToConsole(error, true);
                
                submitBtn.disabled = false;
                submitBtn.textContent = "Try Again";
                submitBtn.classList.replace('bg-slate-400', 'bg-emerald-600');
            }
        }
    </script>
</body>
</html>
