<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Detroit Jazz Fest 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css?family=Staatliches|Montserrat:400,500,600,700,800|Lato:400,600,700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #ffffff;
    --panel: #ffffff;
    --panel2: #ffffff;
    --border: rgba(51,51,51,0.12);
    --text: #000000;
    --text-dim: #5b5b5b;
    --accent: #265398;
    --accent-text: #ffffff;
    --sig: #c9962b;
    --bigband: #a13d3d;
    --tag-bg: #f0f3f8;
    --card-hover: #f7f9fc;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'Montserrat', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  h1, h2, .stage-title, .venue-title, .tab {
    font-family: 'Staatliches', 'Montserrat', sans-serif;
    letter-spacing: 0.5px;
  }
  header {
    padding: 26px 20px 16px;
    text-align: center;
    border-bottom: 1px solid var(--border);
    background: #ffffff;
  }
  header .logo {
    height: 64px;
    width: auto;
    margin-bottom: 8px;
  }
  header h1 {
    margin: 0 0 4px;
    font-size: 2rem;
    letter-spacing: 0.5px;
    color: var(--accent);
    text-transform: uppercase;
  }
  header p {
    margin: 0;
    color: var(--text-dim);
    font-size: 0.85rem;
    font-family: 'Lato', sans-serif;
  }
  .tabs {
    display: flex;
    gap: 6px;
    overflow-x: auto;
    padding: 12px 16px;
    background: var(--bg);
    position: sticky;
    top: 0;
    z-index: 10;
    border-bottom: 1px solid var(--border);
  }
  .tab {
    flex: 0 0 auto;
    padding: 8px 16px;
    border-radius: 999px;
    background: var(--panel);
    border: 1px solid var(--border);
    color: var(--text-dim);
    font-size: 0.85rem;
    font-weight: 600;
    cursor: pointer;
    white-space: nowrap;
  }
  .tab.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .searchbar {
    padding: 8px 16px 4px;
    display: flex;
    gap: 8px;
  }
  .searchbar input {
    flex: 1;
    padding: 10px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel);
    color: var(--text);
    font-size: 0.9rem;
  }
  .genre-filter {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    padding: 8px 16px 4px;
  }
  .genre-chip {
    font-size: 0.7rem;
    padding: 4px 10px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
    cursor: pointer;
    white-space: nowrap;
  }
  .genre-chip.active {
    background: var(--accent);
    color: var(--accent-text);
    border-color: var(--accent);
  }
  .genre-chip.bigband-chip.active {
    background: var(--bigband);
    border-color: var(--bigband);
    color: #ffffff;
  }
  main {
    max-width: 900px;
    margin: 0 auto;
    padding: 8px 16px 60px;
  }
  .venue-block {
    margin-top: 18px;
  }
  .venue-title {
    font-size: 1rem;
    font-weight: 700;
    color: var(--accent);
    margin: 18px 0 8px;
    padding-bottom: 4px;
    border-bottom: 1px solid var(--border);
  }
  .stage-title {
    font-size: 0.8rem;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.6px;
    color: var(--text-dim);
    margin: 14px 0 6px;
  }
  .card {
    background: var(--panel);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 12px 14px;
    margin-bottom: 8px;
    cursor: pointer;
    transition: background 0.15s, box-shadow 0.15s;
  }
  .card:hover { background: var(--card-hover); box-shadow: 0 2px 10px rgba(38,83,152,0.10); }
  .card-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
  }
  .card .time {
    font-size: 0.78rem;
    color: var(--text-dim);
    white-space: nowrap;
    min-width: 100px;
  }
  .card .title {
    font-size: 0.92rem;
    font-weight: 600;
    flex: 1;
  }
  .card .badge {
    font-size: 0.65rem;
    background: var(--sig);
    color: #ffffff;
    padding: 2px 7px;
    border-radius: 999px;
    font-weight: 700;
    white-space: nowrap;
  }
  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 5px;
    margin-top: 8px;
    padding-left: 0;
  }
  .tag {
    font-size: 0.65rem;
    padding: 2px 8px;
    border-radius: 999px;
    background: var(--tag-bg);
    color: var(--text-dim);
    border: 1px solid var(--border);
  }
  .tag.bigband { background: var(--bigband); color: #ffffff; border-color: var(--bigband); font-weight: 700; }
  .empty-note {
    color: var(--text-dim);
    font-size: 0.85rem;
    padding: 20px 4px;
    text-align: center;
  }
  .map-wrap {
    padding: 10px 0 30px;
    text-align: center;
  }
  .map-wrap img {
    width: 100%;
    border-radius: 14px;
    border: 1px solid var(--border);
  }
  .map-info {
    background: var(--tag-bg);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 14px 16px;
    margin-top: 14px;
    font-size: 0.85rem;
    line-height: 1.6;
    text-align: left;
    color: var(--text-dim);
  }
  .map-info strong { color: var(--text); }
  /* modal */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,0.6);
    display: none;
    align-items: flex-end;
    justify-content: center;
    z-index: 100;
  }
  .overlay.open { display: flex; }
  .modal {
    background: var(--panel2);
    border: 1px solid var(--border);
    border-radius: 16px 16px 0 0;
    max-width: 560px;
    width: 100%;
    padding: 22px 20px 28px;
    max-height: 85vh;
    overflow-y: auto;
  }
  @media (min-width: 640px) {
    .overlay { align-items: center; }
    .modal { border-radius: 16px; margin: 20px; }
  }
  .modal h2 {
    margin: 0 0 6px;
    font-size: 1.25rem;
  }
  .modal .meta {
    color: var(--text-dim);
    font-size: 0.85rem;
    line-height: 1.5;
    margin-bottom: 10px;
  }
  .modal .meta strong { color: var(--text); }
  .modal .tags-row {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 16px;
  }
  .modal .bio {
    font-size: 0.88rem;
    line-height: 1.6;
    color: var(--text);
    margin-bottom: 14px;
  }
  .modal .notes {
    font-size: 0.82rem;
    line-height: 1.5;
    color: var(--text-dim);
    margin-bottom: 18px;
    padding: 10px 12px;
    background: var(--tag-bg);
    border-radius: 10px;
    border: 1px solid var(--border);
  }
  .modal-actions {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .btn {
    display: block;
    text-align: center;
    padding: 13px 16px;
    border-radius: 10px;
    font-weight: 700;
    font-size: 0.9rem;
    text-decoration: none;
    border: none;
    cursor: pointer;
  }
  .btn-primary { background: var(--accent); color: #ffffff; }
  .btn-spotify { background: #1DB954; color: #06210f; }
  .btn-close {
    background: transparent;
    color: var(--text-dim);
    margin-top: 4px;
  }
  .legend {
    font-size: 0.72rem;
    color: var(--text-dim);
    text-align: center;
    padding: 6px 16px 0;
  }
  .legend span.badge {
    font-size: 0.65rem;
    background: var(--sig);
    color: #ffffff;
    padding: 1px 6px;
    border-radius: 999px;
    font-weight: 700;
  }
</style>
</head>

const DAY_LABELS = {fri:"Fri, Sept 4", sat:"Sat, Sept 5", sun:"Sun, Sept 6", mon:"Mon, Sept 7", map:"Grounds Map"};
const DAY_ORDER = ["fri","sat","sun","mon","map"];
let currentDay = "fri";
let currentSearch = "";
let activeGenre = null;

function fmtTime(t) {
  let [h, m] = t.split(":").map(Number);
  const ampm = h >= 12 ? "PM" : "AM";
  let h12 = h % 12; if (h12 === 0) h12 = 12;
  return `${h12}:${String(m).padStart(2,"0")} ${ampm}`;
}

function allGenres() {
  const s = new Set();
  DATA.forEach(e => (e.genres||[]).forEach(g => s.add(g)));
  return Array.from(s).sort();
}

function renderTabs() {
  const tabs = document.getElementById("tabs");
  tabs.innerHTML = DAY_ORDER.map(d =>
    `<div class="tab ${d===currentDay?'active':''}" data-day="${d}">${DAY_LABELS[d]}</div>`
  ).join("");
  tabs.querySelectorAll(".tab").forEach(el => {
    el.addEventListener("click", () => {
      currentDay = el.dataset.day;
      renderTabs();
      renderMain();
    });
  });
}

function renderGenreFilter() {
  const wrap = document.getElementById("genreFilter");
  wrap.innerHTML = allGenres().map(g =>
    `<div class="genre-chip ${g==='Big Band' ? 'bigband-chip':''} ${activeGenre===g?'active':''}" data-genre="${g}">${g}</div>`
  ).join("");
  wrap.querySelectorAll(".genre-chip").forEach(el => {
    el.addEventListener("click", () => {
      activeGenre = (activeGenre === el.dataset.genre) ? null : el.dataset.genre;
      renderGenreFilter();
      renderMain();
    });
  });
}

function renderMain() {
  const main = document.getElementById("main");

  if (currentDay === "map") {
    main.innerHTML = `
      <div class="map-wrap">
        <img src="${MAP_IMG}" alt="Hart Plaza festival grounds map" />
        <div class="map-info">
          <strong>Detroit Jazz Hall &amp; Dee Dee Bridgewater's</strong> are located inside the Gretchen C. Valade Jazz Center at Wayne State University, 4743 Cass Ave. in Midtown &mdash; 2&frac12; miles north of Hart Plaza.<br><br>
          <strong>Gates:</strong> Hart Plaza opens 5:30pm Friday, 12:30pm Saturday/Sunday/Monday.<br>
          <strong>Stages:</strong> Carhartt Amphitheater Stage, JPMorganChase Stage, Waterfront Stage.<br>
          Map shows VIP areas, food/drink, restrooms, medical tent, accessibility seating, and merchandise/signing locations.
        </div>
      </div>`;
    return;
  }

  const q = currentSearch.trim().toLowerCase();
  let events = DATA.filter(e => e.day === currentDay);
  if (activeGenre) events = events.filter(e => (e.genres||[]).includes(activeGenre));
  if (q) {
    events = DATA.filter(e => e.title.toLowerCase().includes(q) || (e.notes||"").toLowerCase().includes(q) || (e.bio||"").toLowerCase().includes(q));
    if (activeGenre) events = events.filter(e => (e.genres||[]).includes(activeGenre));
  }
  if (events.length === 0) {
    main.innerHTML = `<div class="empty-note">No performances match your filters.</div>`;
    return;
  }
  const venues = {};
  events.forEach(e => {
    venues[e.venue] = venues[e.venue] || {};
    venues[e.venue][e.stage] = venues[e.venue][e.stage] || [];
    venues[e.venue][e.stage].push(e);
  });
  let html = "";
  Object.keys(venues).forEach(venue => {
    html += `<div class="venue-block"><div class="venue-title">${venue}</div>`;
    Object.keys(venues[venue]).forEach(stage => {
      html += `<div class="stage-title">${stage}</div>`;
      venues[venue][stage].sort((a,b) => a.start.localeCompare(b.start)).forEach(e => {
        const idx = DATA.indexOf(e);
        const tags = (e.genres||[]).map(g => `<span class="tag ${g==='Big Band'?'bigband':''}">${g}</span>`).join("");
        html += `<div class="card" data-idx="${idx}">
          <div class="card-top">
            <div class="time">${fmtTime(e.start)}&ndash;${fmtTime(e.end)}</div>
            <div class="title">${e.title}</div>
            ${e.sig ? '<div class="badge">SIG</div>' : ''}
          </div>
          <div class="card-tags">${tags}</div>
        </div>`;
      });
    });
    html += `</div>`;
  });
  main.innerHTML = html;
  main.querySelectorAll(".card").forEach(el => {
    el.addEventListener("click", () => openModal(DATA[el.dataset.idx]));
  });
}

function icsDate(dateStr, timeStr) {
  const [y,mo,d] = dateStr.split("-");
  const [h,mi] = timeStr.split(":");
  return `${y}${mo}${d}T${h}${mi}00`;
}

function buildIcs(e) {
  let endDate = e.date, endTime = e.end;
  if (e.end === "24:00") { endTime = "23:59"; }
  const lines = [
    "BEGIN:VCALENDAR",
    "VERSION:2.0",
    "PRODID:-//Detroit Jazz Fest 2026 Dashboard//EN",
    "BEGIN:VEVENT",
    "UID:" + Math.random().toString(36).slice(2) + "@detroitjazzfest",
    "DTSTART;TZID=America/Detroit:" + icsDate(e.date, e.start),
    "DTEND;TZID=America/Detroit:" + icsDate(endDate, endTime),
    "SUMMARY:" + e.title.replace(/,/g, "\\,"),
    "LOCATION:" + (e.venue + " - " + e.stage).replace(/,/g, "\\,"),
    "DESCRIPTION:" + ("Detroit Jazz Fest 2026. " + (e.bio || e.notes || "")).replace(/,/g, "\\,").replace(/\n/g, "\\n"),
    "END:VEVENT",
    "END:VCALENDAR"
  ];
  return lines.join("\r\n");
}

function spotifySearchName(title) {
  return title
    .replace(/^\d{4}\s+Artist-In-Residence\s+/i, "")
    .replace(/^\d{4}\s+Legacy Artist:\s*/i, "")
    .replace(/\(.*?\)/g, "")
    .split(" featuring")[0]
    .split(" Featuring")[0]
    .split(":")[0]
    .trim();
}

function openModal(e) {
  const overlay = document.getElementById("overlay");
  const modal = document.getElementById("modal");
  const ics = buildIcs(e);
  const icsHref = "data:text/calendar;charset=utf-8," + encodeURIComponent(ics);
  const tags = (e.genres||[]).map(g => `<span class="tag ${g==='Big Band'?'bigband':''}">${g}</span>`).join("");
  const spotifyHref = "https://open.spotify.com/search/" + encodeURIComponent(spotifySearchName(e.title));
  modal.innerHTML = `
    <h2>${e.title}</h2>
    <div class="meta">
      <strong>${DAY_LABELS[e.day]}</strong>, ${fmtTime(e.start)}&ndash;${fmtTime(e.end)}<br>
      ${e.venue} &mdash; ${e.stage}
      ${e.sig ? '<br><span class="badge">Detroit Signature Series Artist</span>' : ''}
    </div>
    <div class="tags-row">${tags}</div>
    ${e.bio ? `<div class="bio">${e.bio}</div>` : ''}
    ${e.notes ? `<div class="notes">${e.notes}</div>` : ''}
    <div class="modal-actions">
      <a class="btn btn-primary" href="${icsHref}" download="${e.title.replace(/[^a-z0-9]/gi,'_').slice(0,40)}.ics">Add to iPhone Calendar</a>
      <a class="btn btn-spotify" href="${spotifyHref}" target="_blank" rel="noopener">Search on Spotify</a>
      <button class="btn btn-close" id="closeModal">Close</button>
    </div>
  `;
  overlay.classList.add("open");
  document.getElementById("closeModal").addEventListener("click", closeModal);
}

function closeModal() {
  document.getElementById("overlay").classList.remove("open");
}

document.getElementById("overlay").addEventListener("click", (ev) => {
  if (ev.target.id === "overlay") closeModal();
});

document.getElementById("search").addEventListener("input", (ev) => {
  currentSearch = ev.target.value;
  renderMain();
});

renderTabs();
renderGenreFilter();
renderMain();
</script>
